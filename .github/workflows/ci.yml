name: CI
on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://aquinas:aquinas@localhost:5432/aquinas
      FLASK_SECRET_KEY: ci-test-secret
      GOOGLE_CLIENT_ID: dummy-client-id
      GOOGLE_CLIENT_SECRET: dummy-client-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen

      - name: Cache CLTK Latin models
        uses: actions/cache@v4
        with:
          path: ~/cltk_data
          key: cltk-lat-models-v1

      - name: Cache MorphoDiTa models
        uses: actions/cache@v4
        with:
          path: models
          key: morphodita-models-v1

      - name: Download models (CLTK + MorphoDiTa)
        run: uv run python -m acquire.download_models

      - run: uv run pytest
